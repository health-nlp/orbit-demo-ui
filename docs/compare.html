<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./images/orbit-icon.png">
    <title>Orbit - Compare</title>
    <style>
        html, body { min-height: 100%; width: 100%; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6; color: #333;
            display: flex; flex-direction: column; min-height: 100vh; background: #fff;
        }
        header { background: #fff; color: #1a1a2e; width: 100%; padding: 1rem 1.5rem; border-bottom: 1px solid #e0e0e0; }
        nav {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1200px; width: min(1200px, 100%); margin: 0 auto;
        }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .logo a { color: #1a1a2e; text-decoration: none; }
        .nav-tabs { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .nav-tabs a { color: #1a1a2e; text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px; }
        .nav-tabs a:hover, .nav-tabs a.active { background: #f0f0f0; }
        main { max-width: 1200px; width: min(1200px, 100%); margin: 0 auto; padding: 2rem 1.5rem; flex: 1; }
        .btn {
            display: inline-block; padding: 0.75rem 1.5rem;
            background: #1a1a2e; color: white; text-decoration: none;
            border-radius: 4px; margin: 0.5rem; border: none; cursor: pointer; font-size: 1rem;
        }
        .btn:hover { background: #16213e; }
        footer { text-align: center; padding: 2rem 1.5rem; background: #f5f5f5; margin-top: 3rem; width: 100%; }
        footer a { color: #1a1a2e; text-decoration: none; }

        .query-panel {
            max-width: 900px; margin: 0 auto 2rem;
            padding: 1.5rem; border: 1px solid #e3e3e3; border-radius: 10px; background: #fafafa;
        }
        .query-panel + .query-panel { margin-top: 2.5rem; }
        .panel-title {
            font-size: 1rem; font-weight: 700; color: #1a1a2e;
            margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e3e3e3;
        }
        .query-panel label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #1a1a2e; }
        .query-panel .search-row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: stretch; }
        .query-panel input[type="search"] {
            flex: 1 1 320px; padding: 0.9rem 1rem;
            border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;
        }
        .api-toggle { display: flex; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
        .api-toggle input[type="radio"] { display: none; }
        .api-toggle label {
            padding: 0.9rem 1rem; font-size: 0.9rem; font-weight: 500; cursor: pointer;
            background: white; color: #444; border: none; margin: 0;
            transition: background 0.15s, color 0.15s; white-space: nowrap;
        }
        .api-toggle label:not(:last-child) { border-right: 1px solid #ccc; }
        .api-toggle input[type="radio"]:checked + label { background: #16213e; color: white; }
        .result-grid { display: grid; grid-template-columns: repeat(2, 49%); gap: 1rem; margin-top: 1.5rem; overflow-x: auto; }
        .result-card { padding: 1rem; border: 1px solid #e3e3e3; border-radius: 10px; background: white; }
        .result-card h3 { margin-bottom: 0.75rem; color: #16213e; }
        .result-card .json-tree-wrap {
            max-height: 400px; overflow: auto; background: #f6f8fa;
            padding: 1rem; border-radius: 8px; border: 1px solid #ddd;
            margin-top: 0.5rem;
        }
        /* Interactive JSON tree */
        .json-tree { font-family: monospace; font-size: 0.8rem; line-height: 1.6; color: #1a1a2e; word-break: break-all; overflow-wrap: anywhere; }
        .json-tree ul { list-style: none; padding-left: 1.2em; border-left: 1px solid #e0e0e0; margin: 0; }
        .json-tree li { position: relative; }
        .json-toggle { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 0.25em; }
        .json-toggle::before { content: '▾'; font-size: 0.7em; color: #888; display: inline-block; width: 1em; transition: transform 0.15s; }
        .json-toggle.collapsed::before { transform: rotate(-90deg); }
        .json-key { color: #1a1a2e; font-weight: 600; }
        .json-str { color: #2e7d32; }
        .json-num { color: #1565c0; }
        .json-bool { color: #6a1a6a; }
        .json-null { color: #999; }
        .json-summary { color: #aaa; font-size: 0.75em; margin-left: 0.4em; }
        .json-children.hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html"><img src="./images/orbit.png" alt="Orbit" style="height:64px;vertical-align:middle;margin-right:8px;"></a></div>
            <div class="nav-tabs">
                <a href="search.html">Search</a>
                <a href="compare.html" class="active">Compare</a>
                <a href="https://orbit-api.health-nlp.com/docs">API</a>
                <a href="https://github.com/health-nlp/orbit">Code</a>
                <a href="contributors.html">Contributors</a>
            </div>
        </nav>
    </header>
    <main>

        <!-- Panel 1: Orbit vs. Official API -->
        <div class="query-panel">
            <div>
                <div class="panel-title">Orbit vs. Official APIs</div>
                <p>Compare Orbit to official PubMed and ClinicalTrials.gov APIs.</p>
            </div>
            <form id="form-original">
                <label for="query-original">Enter query terms.</label>
                <div class="search-row">
                    <input id="query-original" name="query" type="search" placeholder="e.g. oncology" required autocomplete="off" />
                    <div class="api-toggle">
                        <input type="radio" id="api-ct" name="official_api" value="clinicaltrials" checked>
                        <label for="api-ct">ClinicalTrials.gov</label>
                        <input type="radio" id="api-pm" name="official_api" value="pubmed">
                        <label for="api-pm">PubMed Entrez</label>
                    </div>
                    <button class="btn" type="submit">Run</button>
                </div>
            </form>
            <div id="results-original" class="result-grid"></div>
        </div>

    </main>
    <footer>
        <p>This work is licensed under a <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution 4.0 International License</a>.</p>
    </footer>
    <script>
const ORBIT_BASE = "https://orbit.health-nlp.com";

function renderResult(title, payload, count, label) {
    const card = document.createElement('div');
    card.className = 'result-card';

    const heading = document.createElement('h3');
    heading.textContent = title;
    card.appendChild(heading);

    const countPara = document.createElement('p');
    if (payload?.error) {
        countPara.textContent = 'Error: ' + payload.error;
        countPara.style.color = '#a00';
    } else if (typeof count === 'number') {
        countPara.textContent = `Total hits: ${count} ${label ?? ''}`;
    } else {
        countPara.textContent = `Total hits: unavailable`;
    }
    card.appendChild(countPara);

    const wrap = document.createElement('div');
    wrap.className = 'json-tree-wrap';
    const tree = document.createElement('div');
    tree.className = 'json-tree';
    tree.appendChild(buildJsonNode(payload));
    wrap.appendChild(tree);
    card.appendChild(wrap);

    return card;
}

document.getElementById('form-original').addEventListener('submit', async (event) => {
    event.preventDefault();
    const query = document.getElementById('query-original').value.trim();
    if (!query) return;
    const official = document.querySelector('input[name="official_api"]:checked').value;
    const resultsEl = document.getElementById('results-original');
    resultsEl.innerHTML = '<p>Loading comparison results…</p>';

    const term = encodeURIComponent(query);
    let orbitUrl, officialUrl, officialKey;
    if (official === 'pubmed') {
        orbitUrl = `${ORBIT_BASE}/entrez/eutils/esearch.fcgi?term=${term}&retmode=json`;
        officialUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${term}&retmode=json`;
        officialKey = 'pubmed';
    } else {
        orbitUrl = `${ORBIT_BASE}/ct/api/v2/studies?query.term=${term}`;
        officialUrl = `https://clinicaltrials.gov/api/v2/studies?query.term=${term}&pageSize=10&countTotal=true`;
        officialKey = 'clinicaltrials';
    }

    try {
        const [orbitResp, officialResp] = await Promise.allSettled([fetch(orbitUrl), fetch(officialUrl)]);
        const orbitData = orbitResp.status === 'fulfilled' && orbitResp.value.ok
            ? await orbitResp.value.json()
            : { error: orbitResp.reason?.message ?? 'Request failed' };
        const officialData = officialResp.status === 'fulfilled' && officialResp.value.ok
            ? await officialResp.value.json()
            : { error: officialResp.reason?.message ?? 'Request failed' };

        const data = { orbit: orbitData, [officialKey]: officialData };
        resultsEl.innerHTML = '';
        const officialLabel = official === 'pubmed' ? 'PubMed Entrez API' : 'ClinicalTrials.gov API';
        const label = official === "pubmed" ? "docs" : "trials";

        const orbitCount = data.orbit?.totalCount ?? (data.orbit?.esearch?.count != null ? parseInt(data.orbit.esearch.count, 10) : null);
        const officialCount = data.clinicaltrials?.totalCount ?? (data.pubmed?.esearchresult?.count != null ? parseInt(data.pubmed.esearchresult.count, 10) : null);
        resultsEl.appendChild(renderResult('Orbit API', data.orbit, orbitCount, label));
        resultsEl.appendChild(renderResult(officialLabel, data[officialKey], officialCount, label));
    } catch (err) {
        resultsEl.innerHTML = `<div class="result-card"><h3>Request failed</h3><p style="color:#a00;">${err.message}</p></div>`;
    }
});

/* ── Interactive JSON tree builder ── */
function buildJsonNode(value) {
  if (Array.isArray(value)) return buildArray(value);
  if (value !== null && typeof value === "object") return buildObject(value);
  return buildLeaf(value);
}

function buildObject(obj) {
  const keys = Object.keys(obj);
  if (keys.length === 0) return span("{}", "json-null");

  const wrapper = document.createElement("span");
  const toggle = document.createElement("span");
  toggle.className = "json-toggle";
  toggle.appendChild(span("{", ""));
  const summary = span(` ${keys.length} key${keys.length !== 1 ? "s" : ""} }`, "json-summary");
  toggle.appendChild(summary);

  const ul = document.createElement("ul");
  ul.className = "json-children";
  keys.forEach(k => {
    const li = document.createElement("li");
    li.appendChild(span(`"${k}": `, "json-key"));
    li.appendChild(buildJsonNode(obj[k]));
    ul.appendChild(li);
  });

  toggle.onclick = (e) => { e.stopPropagation(); toggleNode(toggle, ul, summary, keys.length, "key", "keys"); };
  wrapper.appendChild(toggle);
  wrapper.appendChild(ul);
  return wrapper;
}

function buildArray(arr) {
  if (arr.length === 0) return span("[]", "json-null");

  const wrapper = document.createElement("span");
  const toggle = document.createElement("span");
  toggle.className = "json-toggle";
  toggle.appendChild(span("[", ""));
  const summary = span(` ${arr.length} item${arr.length !== 1 ? "s" : ""} ]`, "json-summary");
  toggle.appendChild(summary);

  const ul = document.createElement("ul");
  ul.className = "json-children";
  arr.forEach((v, i) => {
    const li = document.createElement("li");
    li.appendChild(span(`${i}: `, "json-key"));
    li.appendChild(buildJsonNode(v));
    ul.appendChild(li);
  });

  toggle.onclick = (e) => { e.stopPropagation(); toggleNode(toggle, ul, summary, arr.length, "item", "items"); };
  wrapper.appendChild(toggle);
  wrapper.appendChild(ul);
  return wrapper;
}

function buildLeaf(value) {
  if (value === null) return span("null", "json-null");
  if (typeof value === "string") return span(`"${value}"`, "json-str");
  if (typeof value === "number") return span(String(value), "json-num");
  if (typeof value === "boolean") return span(String(value), "json-bool");
  return span(String(value), "");
}

function toggleNode(toggle, ul, summary, count, singular, plural) {
  const collapsed = toggle.classList.toggle("collapsed");
  ul.classList.toggle("hidden", collapsed);
  if (collapsed) {
    summary.textContent = ` ${count} ${count !== 1 ? plural : singular} }`;
  } else {
    summary.textContent = ` ${count} ${count !== 1 ? plural : singular} }`;
  }
}

function span(text, cls) {
  const el = document.createElement("span");
  if (cls) el.className = cls;
  el.textContent = text;
  return el;
}
    </script>
</body>
</html>
